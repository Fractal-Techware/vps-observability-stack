# FTW Single-VPS Observability Stack (free edition).
#
#   ./setup.sh --domain monitoring.example.com --tls you@example.com
#   docker compose up -d
#
# Only Caddy publishes ports (80/443). Everything else lives on internal networks.
# Secrets are files under ./secrets/ generated by setup.sh - never commit them.
name: ${COMPOSE_PROJECT_NAME:-ftwvps}

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # One-shot: gives each named volume to the uid its service runs as (idempotent, exits).
  volume-init:
    image: busybox:1.37
    restart: "no"
    network_mode: none
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    command: ["sh", "/scripts/volume-init.sh"]
    volumes:
      - ./scripts/volume-init.sh:/scripts/volume-init.sh:ro
      - caddy-data:/volumes/65532/caddy-data
      - caddy-config:/volumes/65532/caddy-config
      - grafana-data:/volumes/472/grafana-data
      - prometheus-data:/volumes/65534/prometheus-data

  caddy:
    <<: *hardening
    image: caddy:2.11.4
    user: "65532:65532"
    read_only: true
    # The caddy binary carries a file capability (cap_net_bind_service); exec fails without it in the
    # bounding set. Caddy still only listens on unprivileged ports 8080/8443.
    cap_add:
      - NET_BIND_SERVICE
    depends_on:
      volume-init:
        condition: service_completed_successfully
      grafana:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:8080/tcp"
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:8443/tcp"
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:8443/udp"
    environment:
      DOMAIN: ${DOMAIN:?run ./setup.sh first (DOMAIN is not set)}
      CADDY_TLS: ${CADDY_TLS:?run ./setup.sh first (CADDY_TLS is not set)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/routes.d:/etc/caddy/routes.d:ro
      - caddy-data:/data
      - caddy-config:/config
    tmpfs:
      - /tmp
    secrets:
      - caddy_admin_users
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9180/metrics"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - edge
      - internal
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  grafana:
    <<: *hardening
    image: grafana/grafana:13.2.2
    user: "472:0"
    read_only: true
    depends_on:
      volume-init:
        condition: service_completed_successfully
    environment:
      GF_SERVER_DOMAIN: ${DOMAIN}
      GF_SERVER_ROOT_URL: https://${DOMAIN}/
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: lax
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_STRICT_TRANSPORT_SECURITY: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DATABASE_WAL: "true"
      GF_LOG_MODE: console
      GF_PATHS_DATA: /var/lib/grafana
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    tmpfs:
      - /tmp
    secrets:
      - grafana_admin_password
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - edge
      - internal
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: ${GRAFANA_MEMORY_LIMIT:-512M}

  prometheus:
    <<: *hardening
    image: prom/prometheus:v3.14.0
    user: "65534:65534"
    read_only: true
    depends_on:
      volume-init:
        condition: service_completed_successfully
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-10GB}
      - --web.external-url=https://${DOMAIN}/prometheus/
      - --web.route-prefix=/prometheus
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/prometheus/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: ${PROMETHEUS_MEMORY_LIMIT:-1G}

  node-exporter:
    <<: *hardening
    image: prom/node-exporter:v1.12.1
    user: "65534:65534"
    read_only: true
    pid: host
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+|var/lib/containerd/.+|snap/.+)($$|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs|tmpfs)$$
    volumes:
      - /:/host:ro,rslave
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9100/metrics"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

networks:
  # Services that need outbound internet (ACME) or published ports.
  edge:
  # No outbound internet. Prometheus and the exporter live here.
  internal:
    internal: true

volumes:
  caddy-data:
  caddy-config:
  grafana-data:
  prometheus-data:

secrets:
  grafana_admin_password:
    file: ./secrets/grafana_admin_password
  caddy_admin_users:
    file: ./secrets/caddy_admin_users
