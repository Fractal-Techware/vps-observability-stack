# Core jobs. `instance` of the host-level job is the VPS hostname written by setup.sh into
# generated/node.yml, so the dashboard and the alerts show a real host name.
scrape_configs:
  - job_name: prometheus
    metrics_path: /prometheus/metrics
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    file_sd_configs:
      - files: ["/etc/prometheus/generated/node.yml"]
        refresh_interval: 1m

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

  - job_name: caddy
    static_configs:
      - targets: ["caddy:9180"]
