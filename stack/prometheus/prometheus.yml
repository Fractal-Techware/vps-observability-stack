# FTW Single-VPS Observability Stack (free edition) - Prometheus.
# Scrape jobs live in scrape.d/*.yml and alert rules in rules/*.yml, so your own additions
# stay in separate files. Validate with: scripts/check-config.sh
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_config_files:
  - /etc/prometheus/scrape.d/*.yml
