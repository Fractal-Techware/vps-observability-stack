# promtool unit tests for rules/ftwvps-essentials.yml. Every alert has a case that must fire
# and a case that must stay quiet (a healthy host, an excluded filesystem, or a moment before
# the `for:` duration has elapsed). Run them with scripts/check-config.sh, or directly:
#   docker run --rm -v "$PWD/prometheus:/p:ro" --entrypoint promtool prom/prometheus:v3.14.0 \
#     test rules /p/tests/ftwvps-essentials.test.yml
rule_files:
  - ../rules/ftwvps-essentials.yml
evaluation_interval: 1m

tests:
  - name: TargetDown fires after 2m, not for healthy targets
    interval: 1m
    input_series:
      - series: 'up{job="node", instance="vps1"}'
        values: "1 0 0 0 0"
      - series: 'up{job="grafana", instance="grafana:3000"}'
        values: "1 1 1 1 1"
    alert_rule_test:
      - eval_time: 2m
        alertname: TargetDown
        exp_alerts: []
      - eval_time: 4m
        alertname: TargetDown
        exp_alerts:
          - exp_labels: {severity: critical, job: node, instance: vps1}
            exp_annotations: {description: "Prometheus has failed to scrape node on vps1 for 2 minutes.", summary: "node target vps1 is down"}

  - name: HostHighCpuUsage
    interval: 1m
    input_series:
      # busy: idle grows 3s per minute (95% busy); calm: idle grows 50s per minute
      - series: 'node_cpu_seconds_total{job="node", instance="busy", cpu="0", mode="idle"}'
        values: "0+3x40"
      - series: 'node_cpu_seconds_total{job="node", instance="calm", cpu="0", mode="idle"}'
        values: "0+50x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: HostHighCpuUsage
        exp_alerts:
          - exp_labels: {severity: warning, instance: busy}
            exp_annotations: {description: "CPU usage has been 95% for 15 minutes.", summary: "CPU usage on busy above 90%"}
      - eval_time: 10m
        alertname: HostHighCpuUsage
        exp_alerts: []

  - name: HostOutOfMemory
    interval: 1m
    input_series:
      - series: 'node_memory_MemAvailable_bytes{job="node", instance="vps1"}'
        values: "50x10"
      - series: 'node_memory_MemTotal_bytes{job="node", instance="vps1"}'
        values: "1000x10"
      - series: 'node_memory_MemAvailable_bytes{job="node", instance="vps2"}'
        values: "500x10"
      - series: 'node_memory_MemTotal_bytes{job="node", instance="vps2"}'
        values: "1000x10"
    alert_rule_test:
      - eval_time: 3m
        alertname: HostOutOfMemory
        exp_alerts: []
      - eval_time: 6m
        alertname: HostOutOfMemory
        exp_alerts:
          - exp_labels: {severity: critical, job: node, instance: vps1}
            exp_annotations: {description: "Only 5.0% of RAM is available.", summary: "vps1 has less than 10% memory available"}

  - name: HostDiskSpaceLow
    interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{job="node", instance="vps1", device="/dev/sda1", fstype="ext4", mountpoint="/"}'
        values: "5x10"
      - series: 'node_filesystem_size_bytes{job="node", instance="vps1", device="/dev/sda1", fstype="ext4", mountpoint="/"}'
        values: "100x10"
      - series: 'node_filesystem_readonly{job="node", instance="vps1", device="/dev/sda1", fstype="ext4", mountpoint="/"}'
        values: "0x10"
      - series: 'node_filesystem_avail_bytes{job="node", instance="vps1", device="tmpfs", fstype="tmpfs", mountpoint="/run"}'
        values: "1x10"
      - series: 'node_filesystem_size_bytes{job="node", instance="vps1", device="tmpfs", fstype="tmpfs", mountpoint="/run"}'
        values: "100x10"
      - series: 'node_filesystem_readonly{job="node", instance="vps1", device="tmpfs", fstype="tmpfs", mountpoint="/run"}'
        values: "0x10"
    alert_rule_test:
      - eval_time: 6m
        alertname: HostDiskSpaceLow
        exp_alerts:
          - exp_labels: {severity: critical, job: node, instance: vps1, device: /dev/sda1, fstype: ext4, mountpoint: /}
            exp_annotations: {description: "5.0% free on /dev/sda1.", summary: "Disk / on vps1 has less than 10% free"}

  - name: HostDiskWillFillIn24Hours
    interval: 1m
    input_series:
      # 30 GB free of 100 GB, losing 100 MB per minute -> empty in ~5 hours
      - series: 'node_filesystem_avail_bytes{job="node", instance="vps1", device="/dev/sda1", fstype="ext4", mountpoint="/"}'
        values: "30000000000-100000000x120"
      - series: 'node_filesystem_size_bytes{job="node", instance="vps1", device="/dev/sda1", fstype="ext4", mountpoint="/"}'
        values: "100000000000x120"
      - series: 'node_filesystem_readonly{job="node", instance="vps1", device="/dev/sda1", fstype="ext4", mountpoint="/"}'
        values: "0x120"
      # stable disk
      - series: 'node_filesystem_avail_bytes{job="node", instance="vps2", device="/dev/sda1", fstype="ext4", mountpoint="/"}'
        values: "30000000000x120"
      - series: 'node_filesystem_size_bytes{job="node", instance="vps2", device="/dev/sda1", fstype="ext4", mountpoint="/"}'
        values: "100000000000x120"
      - series: 'node_filesystem_readonly{job="node", instance="vps2", device="/dev/sda1", fstype="ext4", mountpoint="/"}'
        values: "0x120"
    alert_rule_test:
      - eval_time: 30m
        alertname: HostDiskWillFillIn24Hours
        exp_alerts: []
      - eval_time: 90m
        alertname: HostDiskWillFillIn24Hours
        exp_alerts:
          - exp_labels: {severity: warning, job: node, instance: vps1, device: /dev/sda1, fstype: ext4, mountpoint: /}
            exp_annotations: {description: "At the current write rate the filesystem runs out of space within a day.", summary: "Disk / on vps1 will fill within 24 hours"}

  - name: PrometheusConfigReloadFailed
    interval: 1m
    input_series:
      - series: 'prometheus_config_last_reload_successful{job="prometheus", instance="localhost:9090"}'
        values: "1 1 0 0 0 0 0 0 0"
    alert_rule_test:
      - eval_time: 4m
        alertname: PrometheusConfigReloadFailed
        exp_alerts: []
      - eval_time: 8m
        alertname: PrometheusConfigReloadFailed
        exp_alerts:
          - exp_labels: {severity: warning, job: prometheus, instance: "localhost:9090"}
            exp_annotations: {description: "Prometheus is running an old configuration. Run scripts/check-config.sh.", summary: "Prometheus configuration reload failed"}
