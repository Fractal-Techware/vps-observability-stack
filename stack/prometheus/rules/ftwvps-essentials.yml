# FTW Single-VPS Observability Stack (free edition) - the 6 essential alerts.
# Unit tests: prometheus/tests/ftwvps-essentials.test.yml (run scripts/check-config.sh).
#
# These fire in Prometheus and are visible at https://<domain>/prometheus/alerts.
# Routing them to e-mail, Slack, Telegram or a webhook needs Alertmanager, which is part
# of the paid editions (see the README).
groups:
  - name: ftwvps-availability
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} target {{ $labels.instance }} is down"
          description: "Prometheus has failed to scrape {{ $labels.job }} on {{ $labels.instance }} for 2 minutes."

  - name: ftwvps-host
    rules:
      - alert: HostHighCpuUsage
        expr: 100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 90
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "CPU usage on {{ $labels.instance }} above 90%"
          description: "CPU usage has been {{ $value | printf \"%.0f\" }}% for 15 minutes."

      - alert: HostOutOfMemory
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes * 100 < 10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} has less than 10% memory available"
          description: "Only {{ $value | printf \"%.1f\" }}% of RAM is available."

      - alert: HostDiskSpaceLow
        expr: |
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes * 100 < 10
          and node_filesystem_readonly == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disk {{ $labels.mountpoint }} on {{ $labels.instance }} has less than 10% free"
          description: "{{ $value | printf \"%.1f\" }}% free on {{ $labels.device }}."

      - alert: HostDiskWillFillIn24Hours
        expr: |
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}[6h], 24 * 3600) < 0
          and node_filesystem_avail_bytes / node_filesystem_size_bytes * 100 < 40
          and node_filesystem_readonly == 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Disk {{ $labels.mountpoint }} on {{ $labels.instance }} will fill within 24 hours"
          description: "At the current write rate the filesystem runs out of space within a day."

  - name: ftwvps-monitoring
    rules:
      - alert: PrometheusConfigReloadFailed
        expr: prometheus_config_last_reload_successful == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus configuration reload failed"
          description: "Prometheus is running an old configuration. Run scripts/check-config.sh."
