name: validate

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pull pinned images
        run: |
          docker pull --quiet prom/prometheus:v3.14.0
          docker pull --quiet caddy:2.11.4

      - name: shell, YAML, promtool, caddy and compose checks
        run: ./run-tests.sh
